<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="STBPlay privacy policy: provider connections, local storage, permissions and deletion.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>STBPlay Privacy Policy</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fb;--paper:#fff;--ink:#162238;--muted:#52627a;--line:#dbe4ef;--accent:#006db8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#091321;color:#fff;padding:44px 24px 38px;border-bottom:4px solid #12a3ff}.wrap{max-width:860px;margin:auto}.brand{font-size:26px;font-weight:800;letter-spacing:-.6px}.brand span{color:#22aaff}h1{font-size:clamp(30px,6vw,44px);line-height:1.2;margin:20px 0 12px}.lede{max-width:650px;color:#b9c8dc;margin:0}main{padding:30px 22px 50px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,4vw,42px)}.policy{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0}footer{font-size:14px;color:var(--muted);padding:25px 3px}a{color:var(--accent);text-underline-offset:3px}a:focus-visible{outline:3px solid #12a3ff;outline-offset:4px}.footlinks{display:flex;flex-wrap:wrap;gap:12px 24px}@media(prefers-color-scheme:dark){:root{--bg:#0a101b;--paper:#101c2e;--ink:#ecf2fb;--muted:#a8b8ce;--line:#2c3c52;--accent:#49b7ff}}@media print{body{background:#fff;color:#111;font-size:11pt}header{background:none;color:#111;padding:0;border:none}.lede,.brand{display:none}main{padding:15px 0}.paper{border:0;padding:0}footer{color:#333}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">STB<span>Play</span></div><h1>Privacy policy</h1><p class="lede">How STBPlay handles provider connections, local information and your choices.</p></div></header>
<main class="wrap"><article class="paper" aria-label="STBPlay privacy policy"><pre class="policy">{{policyBody}}</pre></article>
<footer><p>This page contains no analytics, tracking scripts or embedded third-party resources.</p><div class="footlinks"><a href="mailto:krsptrbeez@gmail.com">Privacy and support contact</a><a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" rel="noreferrer">GitHub hosting privacy statement</a></div></footer></main>
</body></html>
